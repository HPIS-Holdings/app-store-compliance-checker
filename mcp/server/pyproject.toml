[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-compliance-checker"
version = "0.4.0"
description = "Proof-only App Store & Google Play compliance checker CLI and MCP server for Expo and React Native apps"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HPIS Holdings LLC"}]
readme = "README.md"
keywords = ["app-store", "google-play", "compliance", "app-review", "privacy-manifest", "data-safety", "mcp", "expo", "react-native"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]

dependencies = []

[project.urls]
Homepage = "https://github.com/HPIS-Holdings/app-store-compliance-checker"
Issues = "https://github.com/HPIS-Holdings/app-store-compliance-checker/issues"
Documentation = "https://github.com/HPIS-Holdings/app-store-compliance-checker#readme"

[project.optional-dependencies]
test = ["mcp>=1.10,<2"]

[project.scripts]
mcc = "compliance_mcp.cli:entry"
mcc-mcp = "compliance_mcp.server:entry"

[tool.setuptools]
packages = ["compliance_mcp"]

[tool.setuptools.package-data]
compliance_mcp = ["data/*.json", "data/*.jsonl", "data/*.md"]
