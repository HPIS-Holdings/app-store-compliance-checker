- id: APL-INTRO
  title: "Introduction (unnumbered)"
  label: official_requirement
  obligation: informational
  topics: [review, kids, notarization, enforcement]
  requires: "Describes App Store curation; notarization/alternative distribution in some markets; developers must provide age-appropriate experiences for kids; Apple will reject content/behaviour it considers over the line; attempts to cheat the review process lead to removal and possible Program expulsion (text continues on page)."
  uncertainty: "Introduction text was extracted in full but only the opening paragraphs were reviewed in detail."
- id: APL-1
  title: "1. Safety (section preamble)"
  label: official_requirement
  obligation: mandatory
  topics: [safety]
  requires: "Apps must be safe - no upsetting/offensive content, no device damage, no likely physical harm. Some rules also apply to Notarization for iOS/iPadOS apps."
